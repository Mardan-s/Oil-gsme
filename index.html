<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17130e">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)} /* standalone-only */</style>
<title>Permian Wildcatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Crude-black HUD on top (cash, WTI, tanks), a plat-map of survey sections in the middle, tab bar at the bottom. */
:root{
  --crude:#17130e; --crude-2:#2a2219; --brass:#e3b04b; --flare:#f06a1d; --flare-ink:#1a0f06;
  --plat:#cdbd99; --caliche:#e2d6ba; --paper:#f1e9d6; --ink:#33281b; --mute:#77664d; --line:rgba(51,40,27,.24);
  --sage:#4f7a43; --rust:#a63a24; --hud-fg:#efe4cc; --hud-mute:#a8977a;
  --f-display:'Alfa Slab One','Rockwell','Roboto Slab',Georgia,serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%;background:var(--crude)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--crude);color:var(--ink);font:15px/1.4 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--plat)}

/* HUD */
.hud{flex:none;background:var(--crude);color:var(--hud-fg);padding:10px 16px 0}
.hud-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.co{min-width:0}
.rank{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 11px/1 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--hud-mute)}
.cash{font:28px/1.05 var(--f-display);color:var(--brass);font-variant-numeric:tabular-nums;white-space:nowrap}
.rate{font:600 13px/1.1 var(--f-num);color:var(--hud-mute);font-variant-numeric:tabular-nums}
.wti{display:flex;align-items:center;gap:8px;flex:none}
.wti-l{text-align:right;font-family:var(--f-num)}
.wti-l span{display:block;font-size:11px;letter-spacing:.12em;color:var(--hud-mute);font-weight:600}
.wti-l b{display:block;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.wti-l i{display:block;font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:#8fc27a}.dn{color:#ff8a6a}
#spark{width:84px;height:34px;display:block}
.hud-tank{display:flex;gap:8px;margin-top:10px}
.tank{flex:1;min-width:0;background:var(--crude-2);border:1px solid #3d3226;border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tank-meter{height:10px;border-radius:5px;background:#120e0a;overflow:hidden;border:1px solid #3d3226}
.tank-fill{height:100%;width:0;background:var(--brass);transition:width .25s linear}
.tank.full .tank-fill{background:var(--flare);animation:blink .6s steps(2) infinite}
.tank-l{display:flex;justify-content:space-between;gap:6px;font:600 12px/1 var(--f-num);color:var(--hud-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tank-l span:first-child{color:var(--hud-fg)}
.sell{flex:none;min-width:116px;border:0;border-radius:10px;background:var(--flare);color:var(--flare-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 12px;box-shadow:0 3px 0 #9c3f0b}
.sell:active{transform:translateY(2px);box-shadow:0 1px 0 #9c3f0b}
.sell b{font:18px/1 var(--f-display);letter-spacing:.02em}
.sell span{font:700 13px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.sell:disabled{opacity:.5}
.ticker{margin:10px -16px 0;overflow:hidden;white-space:nowrap;border-top:1px solid #3d3226;background:#0f0c09;font:600 12px/26px var(--f-num);letter-spacing:.04em;color:var(--hud-mute)}
.ticker span{display:inline-block;padding-left:100%;animation:marquee 38s linear infinite}

/* Main area */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;
  background-color:var(--plat);
  background-image:repeating-linear-gradient(0deg,transparent 0 47px,var(--line) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,var(--line) 47px 48px)}
.stack{display:flex;flex-direction:column;gap:12px}
h2{font:22px/1.1 var(--f-display);margin:0;text-wrap:balance;color:var(--ink)}
h3{font:600 12px/1 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:6px 0 0}
.sub{font:600 13px/1.3 var(--f-num);color:var(--mute);letter-spacing:.02em}
.coach{background:var(--crude);color:var(--hud-fg);border-radius:10px;padding:10px 12px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.coach b{color:var(--brass);font:12px/1.5 var(--f-display);flex:none}

/* Regions */
.regions{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink);background:var(--caliche);border-radius:999px;padding:7px 12px;font:600 13px/1 var(--f-num);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.lock{border-style:dashed;color:var(--mute)}
.chip.lock:disabled{opacity:.6}

/* Plat map */
.platwrap{background:var(--caliche);border:2px solid var(--ink);padding:8px;border-radius:4px}
.plat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;font:600 11px/1.2 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.plat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tile{position:relative;aspect-ratio:1/1.08;max-width:100%;border:1.5px solid var(--ink);border-radius:2px;background:color-mix(in srgb,var(--crude) var(--p,0%),var(--paper));display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 2px;font-family:var(--f-num);color:var(--ink);overflow:hidden}
.tile .tl{font-size:10.5px;font-weight:700;line-height:1;white-space:nowrap}
.tile .ta{font-size:10px;font-weight:600;line-height:1;opacity:.75}
.tile svg{width:62%;height:auto;flex:1;min-height:0}
.tile .q{flex:1;display:flex;align-items:center;font:18px/1 var(--f-display);opacity:.35}
.tile.dark{color:var(--paper)}
.tile.leased{outline:2px solid var(--flare);outline-offset:-4px}
.tile.cd{background:repeating-linear-gradient(45deg,var(--caliche) 0 5px,var(--plat) 5px 10px)}
.tile.dry{background:#b8ad97;color:#5d5444}
.tile .hot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flare);box-shadow:0 0 0 2px var(--paper)}
.tile .tbar{position:absolute;left:3px;right:3px;bottom:3px;height:4px;background:rgba(0,0,0,.25);border-radius:2px;overflow:hidden}
.tile .tbar i{display:block;height:100%;background:var(--flare);width:0}
.tile .band{position:absolute;top:2px;left:3px;font-size:9px;font-weight:700;letter-spacing:.06em}
.tile.down svg{color:var(--rust)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 12px/1 var(--f-num);color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1.5px solid var(--ink);display:inline-block}

/* Cards, rows, buttons */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .grow{flex:1;min-width:0}
.btn{min-height:44px;border:0;border-radius:9px;padding:0 14px;background:var(--ink);color:var(--paper);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.15}
.btn small{font:600 12px/1 var(--f-num);opacity:.8;font-variant-numeric:tabular-nums}
.btn.go{background:var(--flare);color:var(--flare-ink);box-shadow:0 3px 0 #9c3f0b}
.btn.go:active{transform:translateY(2px);box-shadow:0 1px 0 #9c3f0b}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.42;box-shadow:none}
.btn.col{flex-direction:column;gap:3px;padding:8px 10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns.one{grid-template-columns:1fr}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.k{font:600 11px/1 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bar{height:8px;background:rgba(51,40,27,.14);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--flare);width:0;transition:width .2s linear}
.bar.sage i{background:var(--sage)}
.bar.brass i{background:var(--brass)}
.pill{display:inline-block;font:700 11px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--plat);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--sage);color:var(--paper)}
.pill.bad{background:var(--rust);color:var(--paper)}
.pill.warn{background:var(--brass);color:var(--crude)}
.pill.dark{background:var(--ink);color:var(--paper)}
.muted{color:var(--mute)}
.empty{text-align:center;padding:28px 16px;color:var(--mute)}
.empty svg{width:80px;color:var(--ink);opacity:.5}

/* Wells */
.well{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.well svg{width:44px;color:var(--ink)}
.well.down svg{color:var(--rust)}
.well .wn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.well .wm{font:600 13px/1.3 var(--f-num);color:var(--mute);font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum div{min-width:0}
.sum b{display:block;font:20px/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Pumpjack + derrick animation */
.pj .beam{transform-box:view-box;transform-origin:14px 11.6px;animation:nod 2.6s ease-in-out infinite}
.pj.slow .beam{animation-duration:4s}
.down .pj .beam,.pj.stop .beam{animation:none}
.rig .bit{animation:bob .5s ease-in-out infinite alternate}
@keyframes nod{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(2px)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes blink{50%{opacity:.4}}

/* Upgrades / goals */
.up-c{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.up-c .un{font-weight:700}
.lv{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.lv i{width:10px;height:6px;border-radius:1px;background:rgba(51,40,27,.18)}
.lv i.on{background:var(--brass)}
.goal.done{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage)}
.goal.claimed{opacity:.55}

/* Bottom sheet */
#sheet-wrap,#modal-wrap{position:fixed;inset:0;z-index:20;display:flex;justify-content:center}
#sheet-wrap{align-items:flex-end}
#modal-wrap{align-items:center;padding:16px;z-index:30;background:rgba(10,8,5,.7)}
.scrim{position:absolute;inset:0;background:rgba(10,8,5,.55);border:0;width:100%}
.sheet{position:relative;width:100%;max-width:560px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:slideup .22s ease-out}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--caliche);font:700 18px/1 var(--f-body)}
@keyframes slideup{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.modal{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;animation:pop .2s ease-out}
.modal h2{font-size:24px}
.modal p{margin:0}
.modal .eyebrow{font:600 11px/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--flare)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 14px;min-height:52px}
.choice small{margin-top:3px}

/* Negotiation */
.owner{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.owner .on{font:19px/1.1 var(--f-display)}
.bubble{position:relative;background:var(--caliche);border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:500}
.bubble::before{content:"";position:absolute;top:-8px;left:22px;border:8px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.bubble.mad{background:#f0c9b8}
.bubble.happy{background:#cfe0bf}
.pat{display:flex;gap:4px;align-items:center}
.pat i{width:12px;height:12px;border-radius:50%;background:var(--brass);border:1.5px solid var(--ink)}
.pat i.off{background:transparent}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.seg button{min-height:42px;border:1.5px solid var(--ink);border-radius:8px;background:transparent;font:700 15px/1 var(--f-num)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:disabled{opacity:.35}
input[type=range]{width:100%;height:36px;accent-color:var(--flare);margin:0}
.tactics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tactics .btn{font-size:13px;padding:6px 4px;min-height:48px}
.gut{font:600 13px/1.3 var(--f-num);color:var(--mute)}
.offer-total{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.offer-total b{font:22px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* Tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--crude);border-top:1px solid #3d3226}
.tabs button{position:relative;background:none;border:0;color:var(--hud-mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font:600 11px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;min-height:54px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--brass)}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--flare);color:var(--flare-ink);font:700 10px/16px var(--f-num);padding:0 4px}

/* Toasts, fx */
#toasts{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{max-width:420px;background:var(--crude);color:var(--hud-fg);border-left:4px solid var(--brass);border-radius:8px;padding:9px 12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:pop .2s ease-out}
.toast.bad{border-left-color:var(--rust)}
.toast.good{border-left-color:var(--sage)}
#toasts.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#banner{position:fixed;left:0;right:0;top:38%;z-index:51;text-align:center;pointer-events:none;font:clamp(40px,13vw,72px)/1 var(--f-display);color:var(--brass);text-shadow:0 4px 0 var(--crude),0 0 30px rgba(240,106,29,.6);opacity:0}
#banner.show{animation:bannerIn 2.2s ease-out forwards}
#banner small{display:block;font:700 18px/1.4 var(--f-num);color:var(--hud-fg);text-shadow:0 2px 0 var(--crude);letter-spacing:.06em}
@keyframes bannerIn{0%{opacity:0;transform:scale(.6) rotate(-4deg)}12%{opacity:1;transform:scale(1.12) rotate(2deg)}20%{transform:scale(1) rotate(-1deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.floaty{position:fixed;z-index:52;pointer-events:none;font:22px/1 var(--f-display);color:var(--brass);text-shadow:0 2px 0 var(--crude);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.stats div{min-width:0}
.stats b{display:block;font:600 18px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.name-in{width:100%;min-height:44px;border:1.5px solid var(--ink);border-radius:8px;background:var(--caliche);padding:0 12px;font:20px var(--f-display);color:var(--ink);-webkit-user-select:text;user-select:text}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Feedback: squish, pops, flashes */
.btn,.tile,.chip,.sell,.seg button,.tabs button,.tank{transition:transform .09s ease-out}
.btn:active:not(:disabled),.tile:active,.chip:active,.seg button:active:not(:disabled),.tabs button:active,.tank:active{transform:scale(.94)}
.cash{transform-origin:left center}
.cash.pulse{animation:cashPop .32s ease-out}
@keyframes cashPop{0%{transform:scale(1)}35%{transform:scale(1.1);color:#ffd77a;text-shadow:0 0 18px rgba(227,176,75,.75)}100%{transform:scale(1)}}
.jolt{animation:jolt .18s ease-out}
@keyframes jolt{0%{transform:scale(.86)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.card.flash{animation:cardFlash .7s ease-out}
@keyframes cardFlash{0%{box-shadow:0 0 0 3px var(--brass);background:#fff1c8}100%{box-shadow:0 0 0 0 rgba(227,176,75,0)}}
.tile.reveal{animation:reveal .7s ease-out}
@keyframes reveal{0%{transform:scale(.7) rotate(-6deg);filter:brightness(1.8)}60%{transform:scale(1.08) rotate(1deg)}100%{transform:none;filter:none}}
#h-price{display:inline-block;transform-origin:right center}
#h-price.pf-up{animation:pfu .6s ease-out}
#h-price.pf-dn{animation:pfd .6s ease-out}
@keyframes pfu{0%{color:#8fc27a;transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes pfd{0%{color:#ff8a6a;transform:scale(1.14)}100%{transform:scale(1)}}
.sell.urge{animation:urge 1s ease-in-out infinite}
@keyframes urge{50%{box-shadow:0 3px 0 #9c3f0b,0 0 0 6px rgba(240,106,29,.4)}}
.shake-big{animation:shakeBig .7s}
@keyframes shakeBig{10%{transform:translate(-10px,4px) rotate(-1deg)}20%{transform:translate(9px,-5px) rotate(1deg)}35%{transform:translate(-8px,3px)}50%{transform:translate(6px,-2px)}70%{transform:translate(-3px,1px)}}
#flash{position:fixed;inset:0;z-index:49;pointer-events:none;opacity:0}
#flash.go{animation:flashA .55s ease-out}
@keyframes flashA{0%{opacity:.55}100%{opacity:0}}
.tabs .dot{animation:dotIn .4s ease-out}
@keyframes dotIn{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.bubble .ghost{visibility:hidden}
.bubble .typed{position:absolute;inset:10px 12px}
.floaty.hot{color:var(--flare);font-size:30px}
.vol{display:flex;align-items:center;gap:12px}

@media (prefers-reduced-motion:reduce){
  .cash.pulse,.jolt,.card.flash,.tile.reveal,#h-price.pf-up,#h-price.pf-dn,.sell.urge,.shake-big,.shake,.tabs .dot{animation:none}
  .pj .beam,.rig .bit,.ticker span,.tank.full .tank-fill{animation:none}
  .ticker span{padding-left:16px}
  .sheet,.modal,.toast{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-top">

      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x + dx, ny = y + dy; if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS){ s += f[ny * COLS + nx]; c++; } }

/* ================= audio engine =================
   Everything is synthesized live with Web Audio: plucked-string guitar (Karplus-Strong),
   bells, coins, diesel engines, owner voices, wind and rig ambience. Master bus runs
   through a compressor with a generated reverb send. */
const AU = { c:null };
function auInit(){
  if (AU.c){ if (AU.c.state === 'suspended') AU.c.resume(); return AU.c; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    const c = AU.c = new C();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = .002; comp.release.value = .25;
    AU.master = c.createGain(); AU.master.gain.value = S.vol;
    AU.master.connect(comp); comp.connect(c.destination);
    AU.fx = c.createGain(); AU.fx.gain.value = 1; AU.fx.connect(AU.master);
    AU.amb = c.createGain(); AU.amb.gain.value = 0; AU.amb.connect(AU.master);
    AU.verb = c.createConvolver(); AU.verb.buffer = impulse(c, 2.4, 3.2);
    AU.wet = c.createGain(); AU.wet.connect(AU.verb); AU.verb.connect(AU.fx);
    const sr = c.sampleRate, n = sr * 2;
    AU.noise = c.createBuffer(1, n, sr); AU.brown = c.createBuffer(1, n, sr);
    const wd = AU.noise.getChannelData(0), bd = AU.brown.getChannelData(0); let last = 0;

function tick(dt, offline){
  S.t += dt;

  S.price += (target - S.price) * (1 - Math.pow(.99, dt)) + randn() * .42 * Math.sqrt(dt);
  S.price = clamp(S.price, 18, 190);
  const spd = (fxOn('pause') ? 0 : 1) * (fxOn('boost') ? S.fx.boost.m : 1);
  const crew = lvl('crew');
  for (const w of S.wells.slice()){
    if (w.st === 'drill'){ w.prog += dt * spd; if (w.prog >= w.need) finishWell(w, offline); }
    else if (w.st === 'prod'){
      w.age += dt;
      const q = wellRate(w) * (1 - w.roy) * dt; produce(q); w.cum += q;
      if (!offline && rand() < dt * .0011 * Math.pow(.82, crew)){ w.st = 'down'; w.dt = 0; toast(`${lab(tractOf(w))} #${w.n} went down. Tap it on the Wells tab to fix.`, 'bad'); SND.down(); buzz(40); }
    } else if (w.st === 'down'){

  if (lvl('pipe') && !fxOn('pipecut') && S.bbl > 0 && S.price >= S.autoFloor) sell(S.bbl, autoFrac(), true);

    if (S.t >= S.nextEvent && S.stats.wells > 0 && $('#modal-wrap').hidden && $('#sheet-wrap').hidden){ S.nextEvent = S.t + 75 + rand() * 90; fireEvent(); }
    if (Math.floor(S.t) % 2 === 0 && Math.floor(S.t - dt) % 2 !== 0){ S.ph.push(S.price); if (S.ph.length > 90) S.ph.shift(); }
  }
}

/* ================= negotiation ================= */
function negTract(){ if (!negKey) return null; return S.regions[negKey[0]].tracts[negKey[1]]; }
function ensureNeg(t){
  const T = TYPES[t.owner.type];
  if (!t.neg) t.neg = { pat:T.pat, mood:1, used:{}, roy:T.fixedRoy || .1875, bonus:0, counter:0, line:pick(T.greet), tone:'', read:null, seed:rand() };
  if (!t.neg.bonus) t.neg.bonus = nice(fmv(t) * .8);
  return t.neg;
}
function need(t){
  const T = TYPES[t.owner.type];
  return T.need * t.owner.rf * t.neg.mood * Math.pow(.96, lvl('silver')) * (1 - clamp(S.rep, -50, 50) * .003) * (1 - Math.min(.2, S.legacy * .01));
}
const offerVal = (t, bonus, roy) => bonus / fmv(t) + (roy - .125) * TYPES[t.owner.type].royW;
const bonusFor = (t, roy) => Math.max(.2, need(t) - (roy - .125) * TYPES[t.owner.type].royW) * fmv(t);
const sliderToBonus = (t, v) => nice(fmv(t) * (.2 + 2.8 * Math.pow(v / 1000, 1.3)));
const bonusToSlider = (t, b) => Math.round(1000 * Math.pow(clamp((b / fmv(t) - .2) / 2.8, 0, 1), 1 / 1.3));
function openNeg(r, i){
  const t = S.regions[r].tracts[i]; if (t.st !== 'open' || t.cd > S.t) return;
  negKey = [r, i]; ensureNeg(t); saidLine = null; sheet = { kind:'neg' }; showSheet(); renderNeg();
}
function renderNeg(){
  const t = negTract(); if (!t) return; const n = t.neg, T = TYPES[t.owner.type], o = t.owner;
  const total = n.bonus * t.acres;
  const err = Math.max(.05, .38 - .033 * lvl('silver'));
  const g = bonusFor(t, n.roy), glo = nice(g * (1 - err * (.4 + n.seed))), ghi = nice(g * (1 + err * (1.4 - n.seed)));
  const read = n.read == null ? '' : `<div class="row"><span class="k">Read</span><div class="bar grow ${n.read >= .85 ? 'sage' : n.read >= .6 ? 'brass' : ''}"><i style="width:${clamp(n.read, 0, 1) * 100}%"></i></div></div>`;
  $('#sheet').innerHTML = `<div class="grab"></div><button class="x" data-a="closeSheet" aria-label="Close">×</button>
  <div class="stack">
    <div class="owner">${avatar(o)}<div><div class="on">${esc(o.first)} ${esc(o.last)}</div><div class="sub">${T.name} · ${lab(t)} · ${fmt(t.acres)} ac</div>
      <div class="pat" aria-label="Patience">${Array.from({length:T.pat}, (_, k) => `<i class="${k < n.pat ? '' : 'off'}"></i>`).join('')}<span class="k" style="margin-left:6px">Patience</span></div></div></div>
    <div class="bubble ${n.tone}" id="neg-bubble"><span class="ghost">${esc(n.line)}</span><span class="typed">${esc(n.line)}</span></div>
    ${read}
    <div>
      <div class="row" style="justify-content:space-between"><span class="k">Bonus per acre</span><b class="num" id="neg-bpa">${money(n.bonus)}/ac</b></div>
      <input type="range" id="neg-bonus" min="0" max="1000" step="1" value="${bonusToSlider(t, n.bonus)}" aria-label="Bonus per acre">
      <div class="gut">Your gut says ${money(glo)} to ${money(ghi)} an acre at ${ROY.find(x => x.v === n.roy).l} royalty.</div>
    </div>
    <div>
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="k">Royalty to owner</span><span class="sub" id="neg-nri">You keep ${((1 - n.roy) * 100).toFixed(2).replace(/\.?0+$/, '')}% of the oil</span></div>
      <div class="seg">${ROY.map(x => `<button data-a="roy" data-v="${x.v}" class="${x.v === n.roy ? 'on' : ''}" ${T.fixedRoy && x.v !== T.fixedRoy ? 'disabled' : ''}>${x.l}</button>`).join('')}</div>
    </div>
    ${T.fixedRoy ? '' : `<div class="tactics">
      <button class="btn alt col" data-a="tactic" data-v="talk" ${n.used.talk ? 'disabled' : ''}>Small talk<small>Free</small></button>
      <button class="btn alt col" data-a="tactic" data-v="gift" ${n.used.gift ? 'disabled' : `data-cost="${giftCost(t)}"`}>Bring brisket<small>${money(giftCost(t))}</small></button>
      <button class="btn alt col" data-a="tactic" data-v="hard" ${n.used.hard ? 'disabled' : ''}>Hardball<small>Risky</small></button>
    </div>`}
    <div class="offer-total"><span class="k">Signing bonus</span><b id="neg-total">${money(total)}</b></div>
    <div class="btns ${n.counter ? '' : 'one'}">
      ${n.counter ? `<button class="btn alt col" data-a="counter" data-cost="${n.counter * t.acres}">Take counter<small>${money(n.counter)}/ac · ${money(n.counter * t.acres)}</small></button>` : ''}
      <button class="btn go col" id="neg-offer" data-a="offer" data-cost="${total}">${T.fixedRoy ? 'Submit sealed bid' : 'Make offer'}<small id="neg-offer-s">${S.cash < total ? 'Need ' + money(total) : money(total)}</small></button>
    </div>
  </div>`;
  patchLive($('#sheet'));
  if (n.line !== saidLine){
    saidLine = n.line;
    const dur = voice(o, n.tone === 'mad' ? 'mad' : n.tone === 'happy' ? 'happy' : '', n.line.length) || .7;
    typeIn($('#neg-bubble .typed'), n.line, dur);
  }
}
let saidLine = null;
function typeIn(el, text, dur){
  if (!el || reduced()) return;
  el.textContent = ''; const t0 = performance.now();
  (function step(){
    if (!el.isConnected) return;
    const f = Math.min(1, (performance.now() - t0) / (dur * 1000));
    el.textContent = text.slice(0, Math.ceil(text.length * f));
    if (f < 1) requestAnimationFrame(step);
  })();
}
function updateNegNumbers(){
  const t = negTract(), n = t.neg, total = n.bonus * t.acres;
  $('#neg-bpa').textContent = money(n.bonus) + '/ac';
  $('#neg-total').textContent = money(total);
  const b = $('#neg-offer'); b.dataset.cost = total; b.disabled = S.cash < total;
  $('#neg-offer-s').textContent = S.cash < total ? 'Need ' + money(total) : money(total);
}
const giftCost = t => Math.round(1200 * REG[t.r].mult);
function doTactic(k){
  const t = negTract(), n = t.neg, T = TYPES[t.owner.type]; if (n.used[k]) return;
  n.used[k] = 1;
  if (k === 'talk'){
    if (rand() < T.talk + .03 * lvl('silver')){ n.mood *= .9; n.line = pick(LINES.talkOk); n.tone = 'happy'; SND.goal(); buzz(15); }
    else { n.line = pick(LINES.talkBad); n.tone = ''; }
  } else if (k === 'gift'){
    const c = giftCost(t); if (S.cash < c){ n.used[k] = 0; return; } S.cash -= c; SND.bag();
    if (rand() < .85){ n.mood *= T.gift; n.line = pick(LINES.giftOk); n.tone = 'happy'; buzz(15); }
    else { n.line = pick(LINES.giftBad); n.tone = ''; }
  } else if (k === 'hard'){
    if (rand() < T.hard){ n.mood *= .82; n.line = pick(LINES.hardOk); n.tone = 'happy'; osc({ f:120, to:60, d:.15, v:.5 }); buzz(30); }
    else { n.mood *= 1.06; n.pat -= 1; n.line = pick(LINES.hardBad); n.tone = 'mad'; SND.slam(); buzz([60, 30, 60]); $('#sheet').classList.add('shake'); setTimeout(() => $('#sheet') && $('#sheet').classList.remove('shake'), 500); }
  }
  n.counter = 0;
  if (n.pat <= 0) return walkAway(t);
  renderNeg();
}
function makeOffer(){
  const t = negTract(), n = t.neg, T = TYPES[t.owner.type], total = n.bonus * t.acres;
  if (S.cash < total) return;
  const r = offerVal(t, n.bonus, n.roy) / need(t);
  n.read = r;
  if (r >= 1){
    S.cash -= total; t.st = 'leased'; t.roy = n.roy; S.stats.leases++; S.rep += 1;
    const o = t.owner; t.neg = null; negKey = null;
    voice(o, 'happy', 24); SND.sign(); flash('#e3b04b'); buzz([20, 40, 20, 40, 60]);
    banner('LEASE SIGNED', `${lab(t)} · ${fmt(t.acres)} ac · ${ROY.find(x => x.v === t.roy).l} royalty`);
    toast(`"${pick(LINES.accept)}" — ${o.first} ${o.last}`, 'good');
    openTract(t.r, t.i); renderAll(true);
    return;
  }
  if (T.fixedRoy){ n.pat = 0; return walkAway(t, 'Bid rejected. A major outbid you. Next sale opens in 2:30.'); }
  if (r >= .85){
    n.pat -= 1; n.counter = nice(bonusFor(t, n.roy) * (1 + rand() * .04)); n.line = pick(LINES.counter)(money(n.counter)); n.tone = '';
  } else if (r >= .6){
    n.pat -= 1; n.mood *= 1.02; n.counter = 0; n.line = pick(LINES.low); n.tone = 'mad';
  } else {
    n.pat -= 2; n.mood *= 1.05; n.counter = 0; n.line = pick(LINES.insult); n.tone = 'mad'; buzz([50, 30, 50]); $('#sheet').classList.add('shake'); setTimeout(() => $('#sheet') && $('#sheet').classList.remove('shake'), 500);
  }
  if (n.pat <= 0) return walkAway(t);
  renderNeg();
}
function walkAway(t, msg){
  const o = t.owner; t.cd = S.t + 150; t.neg = null; negKey = null;
  voice(o, 'mad', 30); setTimeout(SND.slam, 650); buzz([80, 40, 120]);
  toast(msg || `"${pick(LINES.walk)}" They won't take your calls for a while.`, 'bad');
  openTract(t.r, t.i); renderAll(true);
}

function spark(){
  const c = $('#spark'), g = c.getContext('2d'), W = c.width, H = c.height, a = S.ph.concat([S.price]);
  g.clearRect(0, 0, W, H); if (a.length < 2) return;

  const X = i => i / (a.length - 1) * (W - 6) + 1, Y = v => H - 4 - (v - mn) / (mx - mn) * (H - 8);

  g.lineTo(X(a.length - 1), H); g.lineTo(X(0), H); g.closePath();
  g.fillStyle = up ? 'rgba(143,194,122,.18)' : 'rgba(255,138,106,.18)'; g.fill();
  g.beginPath(); a.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.strokeStyle = up ? '#8fc27a' : '#ff8a6a'; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke();
  g.beginPath(); g.arc(X(a.length - 1), Y(a[a.length - 1]), 4.5, 0, 7); g.fillStyle = '#e3b04b'; g.fill();

let parts = [], fxRun = false, revealKey = null, combo = 0, lastPush = 0, shownCash = null;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function startFx(){
  const c = $('#fx'), W = Math.round(innerWidth * devicePixelRatio), H = Math.round(innerHeight * devicePixelRatio);

function gusherFx(){

function coinBurst(fromEl, amount){
  if (!fromEl || reduced()){ pulseCash(); return; }
  const a = fromEl.getBoundingClientRect(), b = $('#h-cash').getBoundingClientRect();
  const n = clamp(Math.round(Math.log10(amount + 10) * 2.2), 4, 18);
  for (let k = 0; k < n; k++) parts.push({ kind:'coin', i:k,
    x0:a.left + a.width / 2 + randn() * 14, y0:a.top + a.height / 2 + randn() * 8,
    x1:b.left + Math.min(b.width, 160) * .5 + randn() * 10, y1:b.top + b.height / 2,
    cx:(a.left + b.left) / 2 + randn() * 90, cy:Math.min(a.top, b.top) - 30 - rand() * 90,
    t:-k * .04, sp:1 / (.5 + rand() * .2), rot:rand() * 6 });

function fxLoop(){
  const c = $('#fx'), g = c.getContext('2d'), k = devicePixelRatio, keep = [];
  g.clearRect(0, 0, c.width, c.height);
  for (const p of parts){
    if (p.kind === 'coin'){
      p.t += p.sp / 60;
      if (p.t < 0){ keep.push(p); continue; }
      if (p.t >= 1){ SND.coinTick(p.i); pulseCash(); continue; }
      const t = p.t, u = 1 - t, x = u * u * p.x0 + 2 * u * t * p.cx + t * t * p.x1, y = u * u * p.y0 + 2 * u * t * p.cy + t * t * p.y1;
      const sx = Math.max(.15, Math.abs(Math.cos(p.rot + t * 14))), r = (8 - t * 2) * k;
      g.save(); g.translate(x * k, y * k); g.scale(sx, 1);
      g.beginPath(); g.arc(0, 0, r, 0, 7); g.fillStyle = '#e3b04b'; g.fill(); g.lineWidth = 1.6 * k; g.strokeStyle = '#8a6420'; g.stroke();
      g.beginPath(); g.arc(-r * .3, -r * .3, r * .3, 0, 7); g.fillStyle = 'rgba(255,246,210,.85)'; g.fill();
      g.restore(); keep.push(p); continue;
    }
    if (p.d > 0){ p.d--; keep.push(p); continue; }
    p.life++; p.vy += .28; p.x += p.vx; p.y += p.vy;
    if (p.y < innerHeight + 40 && p.life < 240){
      g.beginPath(); g.ellipse(p.x * k, p.y * k, p.r * k, p.r * k * 1.4, 0, 0, 7); g.fillStyle = p.r > 4.5 ? '#2b2118' : '#120d08'; g.fill(); keep.push(p);
    }
  }
  parts = keep;
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRun = false; g.clearRect(0, 0, c.width, c.height); }
}

      <div class="stats"><div><span class="k">Oil produced</span><b>${fmt(Math.max(0, made))} bbl</b></div><div><span class="k">Pipeline sales</span><b>${money(S.cash - cash0)}</b></div>
      <div><span class="k">Wells finished</span><b>${S.stats.wells - w0}</b></div><div><span class="k">Spilled</span><b>${fmt(S.stats.lost - lost0)} bbl</b></div></div>
      ${!lvl('pipe') && S.bbl > 0 ? '<p class="sub">Your tanks are waiting. Hit SELL.</p>' : ''}
      <button class="btn go block" data-a="modalOk">Back to work</button>`);
  }
}
function welcome(){
  showModal(`<div class="eyebrow">Reeves County, Texas</div><h2>${esc(S.company)}</h2>
    <p>You've got $40,000, a pickup with 200,000 miles on it, and a county full of ranchers who don't trust anybody from Houston.</p>
    <p>Lease the land. Drill the wells. Sell the crude. Don't get blown up.</p>
    <button class="btn go block" data-a="modalOk">Let's go</button>`);
  S.welcomed = true;
}
let lastNow = performance.now(), saveT = 0, uiT = 0;
function loop(){
  const now = performance.now(); let dt = (now - lastNow) / 1000; lastNow = now;
  if (dt > 10) catchUp(dt); else tick(dt, false);
  hud(); renderAll(false); renderSheet(false); ambientTick(dt);
  sparkT += dt; if (sparkT > 1){ sparkT = 0; spark(); }
  newsT += dt; if (newsT > 40){ newsT = 0; setTicker(); }
  saveT += dt; if (saveT > 5){ saveT = 0; save(); }
}
function start(data){
  let s = null;
  if (data && data.save) s = load(data.save);
  if (!s){ try { const raw = localStorage.getItem(KEY); if (raw) s = load(raw); } catch (e) {} }
  S = s || newState();
  if (!S.regions[S.ri]) S.ri = 0;
  if (s) catchUp((Date.now() - (S.savedAt || Date.now())) / 1000);
  hud(); renderAll(true); spark(); setTicker(); rollCash();
  if (!S.welcomed) welcome();
  setInterval(loop, 200);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save:JSON.stringify(S) })); } catch (e) {}
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
